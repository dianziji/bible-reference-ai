# Copy to k8s/secret.yaml (gitignored) and fill in real values before `kubectl apply`.
apiVersion: v1
kind: Secret
metadata:
  name: bible-secrets
  namespace: bible-reference-ai
type: Opaque
stringData:
  OPENAI_API_KEY: "<your-openai-api-key>"
  PINECONE_API_KEY: "<your-pinecone-api-key>"
  LANGSMITH_API_KEY: "<your-langsmith-api-key>"   # optional: LangSmith tracing
