# Redis Deployment + Service
# 后端的 L1 缓存（答案、query embedding、命中统计）。Redis 不可用时后端仍能正常回答，只是不走缓存。
# 单副本、无持久化：缓存丢了只是重新生成一次，不需要 PVC。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bible-redis
  namespace: bible-reference-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bible-redis
  template:
    metadata:
      labels:
        app: bible-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bible-redis-svc
  namespace: bible-reference-ai
spec:
  type: ClusterIP
  selector:
    app: bible-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

